<!DOCTYPE html>
<html>
<head>
    <title>Thank You</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dff6f3, #e8e1ff);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .thankyou-box {
            background-color: white;
            width: 400px;
            padding: 40px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #6c63ff;
        }

        p {
            color: #555;
            font-size: 16px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #6c63ff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="thankyou-box">

        <h1>Thank You!</h1>

        <p>Your registration has been completed successfully.</p>

        <p>Welcome to our student registration system.</p>

        <a href="index.html" class="button">Back to Registration</a>

    </div>

</body>
</html>
